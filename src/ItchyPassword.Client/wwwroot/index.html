<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   script-src 'self' 'wasm-unsafe-eval';
                   style-src 'self';
                   connect-src 'self' https://api.github.com https://www.googleapis.com https://oauth2.googleapis.com;
                   img-src 'self' data:;
                   font-src 'self';
                   base-uri 'self';
                   form-action 'none';
                   object-src 'none';" />
    <title>ItchyPassword</title>
    <base href="/" />

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Theme switcher (must run before CSS to prevent flash of wrong theme) -->
    <script src="js/theme.js"></script>

    <!-- Crypto Service -->
    <script src="js/crypto.js"></script>
    <!-- Google Drive Vault Connector (OAuth popup interop) -->
    <script src="js/googleDrive.js"></script>
    <!-- DOM interop (CSP-compliant style manipulation) -->
    <script src="js/dom.js"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-spinner"></div>
            <p class="app-loading-text">Loading...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
